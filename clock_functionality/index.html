<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>Time Desk</h2>
            <nav>
                <button class="nav-btn active" data-tool="clock">
                    Digital Clock
                </button>

                <button class="nav-btn" data-tool="stopwatch">
                    StopWatch
                </button>

                <button class="nav-btn" data-tool="alarm">
                    Alarm
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>My Workspace</h1>
            </header>

            <section id="workspace">
                <!-- Selected tool will appear here -->
            </section>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
